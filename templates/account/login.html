{% extends 'base.html' %}

{% block title %}Kirish - PharmacyUz{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gray-50 py-12 px-4">
    <div class="max-w-md w-full bg-white rounded-3xl shadow-xl p-8 md:p-10">
        <div class="text-center mb-10">
            <div class="mx-auto w-16 h-16 bg-green-700 rounded-2xl flex items-center justify-center text-4xl mb-4">💊</div>
            <h2 class="text-3xl font-bold">Tizimga kirish</h2>
        </div>

        <form method="POST" class="space-y-6">
            {% csrf_token %}
            {{ form.as_p }}
            
            <button type="submit" class="w-full bg-green-700 hover:bg-green-800 text-white py-4 rounded-3xl text-xl font-semibold transition">
                Kirish
            </button>
        </form>

        <div class="text-center mt-8">
            <p class="text-gray-600">
                Hisobingiz yo'qmi? 
                <a href="{% url 'account_signup' %}" class="text-green-700 font-medium">Ro'yxatdan o'tish</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
